{% extends 'base.html' %}
{% block title %}Create account | ShopSphere{% endblock %}
{% block content %}<main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-sm-10 col-md-7 col-lg-5"><div class="panel bg-white p-4 p-md-5"><div class="text-center mb-4"><div class="fs-1">✨</div><h1 class="h3 fw-bold">Create your account</h1><p class="text-secondary">A better shopping experience starts here.</p></div>
  <form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label" for="username">Username</label><input id="username" name="username" autocomplete="username" maxlength="150" class="form-control" required></div><div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" class="form-control"></div><div class="mb-3"><label class="form-label" for="password">Password</label><input id="password" type="password" name="password" autocomplete="new-password" minlength="8" class="form-control" required><div class="form-text">Use at least 8 characters.</div></div><div class="mb-4"><label class="form-label" for="confirm_password">Confirm password</label><input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" minlength="8" class="form-control" required></div><button class="btn btn-primary btn-lg w-100" type="submit">Create account</button></form><p class="text-center mt-4 mb-0">Already registered? <a href="{% url 'login' %}">Log in</a></p></div></div></div></main>{% endblock %}
