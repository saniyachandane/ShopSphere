{% extends 'base.html' %}
{% block title %}Login | ShopSphere{% endblock %}
{% block content %}<main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-sm-10 col-md-7 col-lg-5"><div class="panel bg-white p-4 p-md-5"><div class="text-center mb-4"><div class="fs-1">👋</div><h1 class="h3 fw-bold">Welcome back</h1><p class="text-secondary">Log in to continue shopping.</p></div>
  <form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label" for="username">Username</label><input id="username" name="username" autocomplete="username" class="form-control" required autofocus></div><div class="mb-4"><label class="form-label" for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" class="form-control" required></div><button class="btn btn-primary btn-lg w-100" type="submit">Login</button></form><p class="text-center mt-4 mb-0">New to ShopSphere? <a href="{% url 'register' %}">Create an account</a></p></div></div></div></main>{% endblock %}
